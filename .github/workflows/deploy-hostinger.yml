name: Deploy Web2Table Business to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm
        run: npm install --global npm@11.21.2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production frontend
        run: npm run build

      - name: Deploy dist to Hostinger using lftp FTPS
        uses: PilarJ/lftp-ftps-deploy@v1
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.HOSTINGER_FTP_SERVER_DIR }}
          parallel: 1
          max-retries: 3
          debug: true
