name: Deploy Web2Table Business to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm
        run: npm install --global npm@11.21.2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production frontend
        env:
          VITE_SUPABASE_URL: https://wvibrchebfwirbgkcnbr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_MILZBeZJeOw-bOeMo3Nukg_BKGWt_Qr
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy assets first and publish entry point last
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
            set ftp:ssl-allow no
            set net:max-retries 3
            set net:reconnect-interval-base 5
            set net:timeout 30
            set ftp:passive-mode true
            mkdir -p assets
            mirror --reverse --delete --verbose --parallel=1 ./dist/assets/ ./assets/
            put ./dist/.htaccess -o .htaccess
            # Publish the HTML last so it never points at bundles that have not uploaded yet.
            put ./dist/index.html -o index.html
            bye
          "
